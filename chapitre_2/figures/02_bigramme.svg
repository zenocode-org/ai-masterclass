<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#475569"/></marker></defs>
<rect width="900" height="330" fill="#fff"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Le bigramme vu comme un nn.Module : une table qui contient directement les logits</text>
<!-- input -->
<rect x="20" y="120" width="90" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="65" y="144" text-anchor="middle" font-size="14" font-weight="bold">'e'</text><text x="65" y="164" text-anchor="middle" font-size="12">indice 43</text>
<!-- table -->
<text x="250" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#c2410c">nn.Embedding(V, V)  — paramètres</text>
<g stroke="#9a3412" stroke-width="1" fill="#ffedd5">
<rect x="160" y="72" width="180" height="16"/><rect x="160" y="88" width="180" height="16"/><rect x="160" y="104" width="180" height="16"/>
<rect x="160" y="136" width="180" height="16"/><rect x="160" y="152" width="180" height="16"/><rect x="160" y="168" width="180" height="16"/><rect x="160" y="184" width="180" height="16"/><rect x="160" y="200" width="180" height="16"/>
</g>
<rect x="160" y="120" width="180" height="16" fill="#fb923c" stroke="#9a3412" stroke-width="2"/>
<text x="250" y="132" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">ligne 43</text>
<text x="250" y="234" text-anchor="middle" font-size="12" fill="#475569">V lignes (un caractère courant)</text>
<text x="250" y="250" text-anchor="middle" font-size="12" fill="#475569">× V colonnes (un score par caractère suivant)</text>
<!-- logits -->
<g fill="#fed7aa" stroke="#9a3412"><rect x="400" y="120" width="20" height="16"/><rect x="420" y="120" width="20" height="16"/><rect x="440" y="120" width="20" height="16"/><rect x="460" y="120" width="20" height="16"/><rect x="480" y="120" width="20" height="16"/><rect x="500" y="120" width="20" height="16"/></g>
<text x="460" y="108" text-anchor="middle" font-size="13" font-weight="bold">logits (V,)</text>
<text x="460" y="156" text-anchor="middle" font-size="11" fill="#475569">scores libres, négatifs possibles</text>
<!-- softmax -->
<rect x="560" y="112" width="100" height="34" rx="17" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="610" y="134" text-anchor="middle" font-size="13">softmax</text>
<g fill="#bbf7d0" stroke="#166534"><rect x="700" y="128" width="20" height="8"/><rect x="720" y="112" width="20" height="24"/><rect x="740" y="132" width="20" height="4"/><rect x="760" y="100" width="20" height="36"/><rect x="780" y="126" width="20" height="10"/><rect x="800" y="130" width="20" height="6"/></g>
<text x="760" y="92" text-anchor="middle" font-size="13" font-weight="bold">probabilités</text>
<text x="760" y="156" text-anchor="middle" font-size="11" fill="#475569">≥ 0, somme = 1</text>
<!-- arrows -->
<g stroke="#475569" stroke-width="2" marker-end="url(#a)" fill="none">
<line x1="110" y1="148" x2="158" y2="130"/><line x1="340" y1="128" x2="398" y2="128"/><line x1="520" y1="128" x2="558" y2="128"/><line x1="660" y1="128" x2="698" y2="128"/>
<path d="M760 160 L760 200"/><path d="M460 166 Q 460 260 560 280"/>
</g>
<!-- branches -->
<rect x="690" y="202" width="150" height="46" rx="8" fill="#f1f5f9" stroke="#64748b"/><text x="765" y="222" text-anchor="middle" font-size="12" font-weight="bold">génération</text><text x="765" y="239" text-anchor="middle" font-size="11">torch.multinomial → 'n'</text>
<rect x="560" y="262" width="300" height="50" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="710" y="283" text-anchor="middle" font-size="12" font-weight="bold">entraînement : F.cross_entropy(logits, cible)</text><text x="710" y="300" text-anchor="middle" font-size="11">= softmax + −log(p de la vraie réponse), en une fois</text>
<text x="20" y="300" font-size="12" fill="#475569">Même chose qu'au chapitre 1 :  one_hot(43) @ W  ==  W[43]  ==  embedding(43)</text>
</svg>
