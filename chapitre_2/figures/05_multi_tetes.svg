<line x1="130" y1="140" x2="198" y2="69"/><line x1="130" y1="145" x2="198" y2="119"/><line x1="130" y1="152" x2="198" y2="169"/><line x1="130" y1="158" x2="198" y2="219"/>
<line x1="360" y1="69" x2="438" y2="125"/><line x1="360" y1="119" x2="438" y2="140"/><line x1="360" y1="169" x2="438" y2="155"/><line x1="360" y1="219" x2="438" y2="172"/>
<line x1="560" y1="148" x2="608" y2="148"/><line x1="740" y1="148" x2="778" y2="148"/>
</g>
<text x="20" y="276" font-size="12" fill="#475569">Chaque tête a ses propres Wq, Wk, Wv : elle peut apprendre à chercher une relation différente. Même coût total qu'une grande tête de 64 canaux.</text>
