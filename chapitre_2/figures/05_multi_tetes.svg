<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#475569"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#dc2626"/></marker></defs>
<rect width="900" height="300" fill="#fff"/>
<text x="450" y="26" text-anchor="middle" font-size="18" font-weight="bold">Multi-head attention : h têtes en parallèle, concaténées sur les canaux</text>
<g font-size="13" text-anchor="middle">
<rect x="20" y="120" width="110" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="75" y="144" font-weight="bold">x</text><text x="75" y="162" font-size="11">(B, T, C=64)</text>
<rect x="200" y="50" width="160" height="38" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="280" y="74">tête 1 → (B,T,16)</text>
<rect x="200" y="100" width="160" height="38" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="280" y="124">tête 2 → (B,T,16)</text>
<rect x="200" y="150" width="160" height="38" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="280" y="174">tête 3 → (B,T,16)</text>
<rect x="200" y="200" width="160" height="38" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="280" y="224">tête 4 → (B,T,16)</text>
<g stroke="#334155"><rect x="440" y="110" width="30" height="76" fill="#c4b5fd"/><rect x="470" y="110" width="30" height="76" fill="#a78bfa"/><rect x="500" y="110" width="30" height="76" fill="#8b5cf6"/><rect x="530" y="110" width="30" height="76" fill="#7c3aed"/></g>
<text x="500" y="100" font-weight="bold">torch.cat(dim=−1)</text><text x="500" y="206" font-size="11">(B, T, 4×16 = 64)</text>
<rect x="610" y="120" width="130" height="56" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="675" y="144" font-weight="bold">proj</text><text x="675" y="162" font-size="11">Linear(64, 64)</text>
<rect x="780" y="120" width="105" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="832" y="144" font-weight="bold">sortie</text><text x="832" y="162" font-size="11">(B, T, C)</text>
</g>
