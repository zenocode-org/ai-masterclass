<rect width="900" height="345" fill="#ffffff"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Deux chemins vers la même table de probabilités</text>
<g font-size="14" text-anchor="middle">
<rect x="20" y="125" width="130" height="70" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="85" y="155" font-weight="bold">names.txt</text><text x="85" y="175" font-size="12">228 146 bigrammes</text>
<rect x="220" y="55" width="150" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="295" y="82" font-weight="bold">compter N</text><text x="295" y="100" font-size="12">N[i, j] += 1</text>
<rect x="430" y="55" width="170" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="515" y="82" font-weight="bold">normaliser</text><text x="515" y="100" font-size="12">P = N / somme de ligne</text>
<rect x="220" y="205" width="150" height="60" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="295" y="232" font-weight="bold">W au hasard</text><text x="295" y="250" font-size="12">torch.randn(27, 27)</text>
<rect x="430" y="205" width="170" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="515" y="228" font-weight="bold">descente de gradient</text><text x="515" y="248" font-size="12">minimiser la NLL</text>
<rect x="680" y="125" width="190" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="775" y="152" font-weight="bold">≈ même table</text><text x="775" y="174" font-size="12">NLL ≈ 2,45 dans les deux cas</text>
