<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#475569"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#dc2626"/></marker></defs>
<rect width="900" height="330" fill="#fff"/>
<text x="450" y="26" text-anchor="middle" font-size="18" font-weight="bold">FeedForward : le MÊME petit réseau appliqué à chaque position, séparément</text>
<g font-size="12" text-anchor="middle">
<text x="70" y="62" font-weight="bold">positions</text>
<rect x="30" y="80" width="80" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="70" y="102">t=0 (C)</text>
<rect x="30" y="140" width="80" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="70" y="162">t=1 (C)</text>
<rect x="30" y="200" width="80" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="70" y="222">t=2 (C)</text>
<text x="70" y="262">…</text>
<!-- one MLP drawn -->
<rect x="170" y="60" width="520" height="200" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4"/>
<text x="430" y="80" font-weight="bold" fill="#166534">mêmes poids pour toutes les positions</text>
<rect x="190" y="130" width="120" height="50" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="250" y="151" font-weight="bold">Linear(C, 4C)</text><text x="250" y="168">élargir</text>
<rect x="340" y="130" width="90" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="385" y="151" font-weight="bold">ReLU</text><text x="385" y="168">max(0, z)</text>
<rect x="460" y="130" width="120" height="50" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="520" y="151" font-weight="bold">Linear(4C, C)</text><text x="520" y="168">revenir à C</text>
<rect x="600" y="130" width="80" height="50" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="640" y="151" font-weight="bold">Dropout</text><text x="640" y="168">p = 0.2</text>
<rect x="760" y="80" width="80" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="800" y="102">t=0 (C)</text>
<rect x="760" y="140" width="80" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="800" y="162">t=1 (C)</text>
<rect x="760" y="200" width="80" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="800" y="222">t=2 (C)</text>
</g>
<g stroke="#475569" stroke-width="2" marker-end="url(#a)" fill="none">
<line x1="110" y1="97" x2="188" y2="145"/><line x1="110" y1="157" x2="188" y2="155"/><line x1="110" y1="217" x2="188" y2="165"/>
<line x1="310" y1="155" x2="338" y2="155"/><line x1="430" y1="155" x2="458" y2="155"/><line x1="580" y1="155" x2="598" y2="155"/>
<line x1="680" y1="145" x2="758" y2="97"/><line x1="680" y1="155" x2="758" y2="157"/><line x1="680" y1="165" x2="758" y2="217"/>
</g>
<g font-size="12" fill="#334155">
<text x="30" y="292">Attention = les positions COMMUNIQUENT (mélange sur T).   FeedForward = chaque position RÉFLÉCHIT seule (mélange sur C).</text>
<text x="30" y="312">Forme : (B, T, C) → (B, T, 4C) → (B, T, C).  Sans ReLU, deux Linear d'affilée = une seule Linear.</text>
</g>
</svg>
