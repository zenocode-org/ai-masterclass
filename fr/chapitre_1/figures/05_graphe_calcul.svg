<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#475569"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#dc2626"/></marker></defs>
<rect width="900" height="320" fill="#ffffff"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Forward : calculer la loss · Backward : remonter les dérivées jusqu'à W</text>
<g font-size="14" text-anchor="middle">
<rect x="30" y="110" width="110" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="85" y="140" font-weight="bold">W</text><text x="85" y="160" font-size="12">requires_grad</text>
<rect x="200" y="110" width="110" height="70" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="255" y="150">logits</text>
<rect x="370" y="110" width="110" height="70" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="425" y="150">probs</text>
<rect x="540" y="110" width="110" height="70" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="595" y="150">p vrai</text>
<rect x="710" y="110" width="140" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="780" y="140" font-weight="bold">loss</text><text x="780" y="160" font-size="12">un seul nombre</text>
</g>
<g stroke="#475569" stroke-width="2" marker-end="url(#a)" fill="none"><line x1="140" y1="130" x2="198" y2="130"/><line x1="310" y1="130" x2="368" y2="130"/><line x1="480" y1="130" x2="538" y2="130"/><line x1="650" y1="130" x2="708" y2="130"/></g>
<g font-size="12" fill="#475569" text-anchor="middle"><text x="170" y="100">x @ W</text><text x="340" y="100">softmax</text><text x="510" y="100">sélection</text><text x="680" y="100">−log, mean</text></g>
<g stroke="#dc2626" stroke-width="2" marker-end="url(#r)" fill="none" stroke-dasharray="6 4"><line x1="708" y1="165" x2="652" y2="165"/><line x1="538" y1="165" x2="482" y2="165"/><line x1="368" y1="165" x2="312" y2="165"/><line x1="198" y1="165" x2="142" y2="165"/></g>
<text x="440" y="215" text-anchor="middle" font-size="14" fill="#dc2626">loss.backward() : règle de la chaîne, de droite à gauche → remplit W.grad (27, 27)</text>
<text x="440" y="245" text-anchor="middle" font-size="14" fill="#0f172a">puis, à la main :  W ← W − lr × W.grad   (backward ne modifie pas W)</text>
<text x="440" y="285" text-anchor="middle" font-size="13" fill="#475569">Pour le bigramme, tout se simplifie : ∂loss/∂logits = (probs − one_hot(y)) / n</text>
</svg>
