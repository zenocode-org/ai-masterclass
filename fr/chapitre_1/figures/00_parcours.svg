<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#475569"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#dc2626"/></marker></defs>
<rect width="900" height="300" fill="#ffffff"/>
<text x="450" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">Chapitre 1 — des bigrammes au premier réseau de neurones, en 6 notebooks</text>
<g font-size="13" text-anchor="middle">
<rect x="60" y="60" width="200" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="160" y="88" font-weight="bold">01 Compter</text><text x="160" y="108">table N, table P, génération</text>
<rect x="350" y="60" width="200" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="450" y="88" font-weight="bold">02 Mesurer</text><text x="450" y="108">likelihood → NLL = la loss</text>
<rect x="640" y="60" width="200" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="740" y="88" font-weight="bold">03 One-hot et W</text><text x="740" y="108">un caractère → 27 scores</text>
<rect x="640" y="200" width="200" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="740" y="228" font-weight="bold">04 Softmax</text><text x="740" y="248">scores → probabilités</text>
<rect x="350" y="200" width="200" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="450" y="228" font-weight="bold">05 Gradients</text><text x="450" y="248">backward, W.grad, un pas</text>
<rect x="60" y="200" width="200" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="160" y="228" font-weight="bold">06 Entraîner</text><text x="160" y="248">boucle et comparaison</text>
</g>
<g stroke="#475569" stroke-width="2" marker-end="url(#a)" fill="none">
<line x1="260" y1="95" x2="348" y2="95"/><line x1="550" y1="95" x2="638" y2="95"/>
<line x1="740" y1="130" x2="740" y2="198"/><line x1="640" y1="235" x2="552" y2="235"/><line x1="350" y1="235" x2="262" y2="235"/>
</g>
<g font-size="12" fill="#475569">
<rect x="20" y="150" width="12" height="12" fill="#dbeafe" stroke="#2563eb"/><text x="38" y="161">approche 1 : compter</text>
<rect x="210" y="150" width="12" height="12" fill="#ede9fe" stroke="#7c3aed"/><text x="228" y="161">le réseau : forward pass</text>
<rect x="420" y="150" width="12" height="12" fill="#dcfce7" stroke="#16a34a"/><text x="438" y="161">le réseau : apprentissage</text>
