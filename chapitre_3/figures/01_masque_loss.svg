<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">SFT : même cross-entropy qu'au chapitre 2, mais seulement sur la réponse</text>
<g font-size="13" text-anchor="middle" font-family="Menlo, Consolas, monospace">
