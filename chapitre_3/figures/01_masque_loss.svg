<g font-size="14" fill="#0f172a">
<rect x="20" y="160" width="14" height="14" fill="#e2e8f0" stroke="#64748b"/><text x="42" y="172">prompt (consigne + contexte) : le modèle le lit, mais ces tokens ne comptent pas dans la loss (label = -100)</text>
<rect x="20" y="188" width="14" height="14" fill="#bbf7d0" stroke="#16a34a"/><text x="42" y="200">réponse (completion) : chaque token est un exercice « prédire le token suivant », comme au chapitre 2</text>
<text x="20" y="232" font-size="15">L(θ) = − Σ  log p_θ( y_t | y_&lt;t , x )   — somme sur les seuls tokens verts ; x = prompt, y = réponse</text>
