<text x="50" y="130" fill="#64748b">-100</text><text x="120" y="130" fill="#64748b">-100</text><text x="215" y="130" fill="#64748b">-100</text><text x="300" y="130" fill="#64748b">-100</text><text x="385" y="130" fill="#64748b">-100</text><text x="470" y="130" fill="#64748b">-100</text><text x="540" y="130" fill="#64748b">-100</text>
<text x="625" y="130" fill="#166534" font-weight="bold">label</text><text x="705" y="130" fill="#166534" font-weight="bold">label</text><text x="775" y="130" fill="#166534" font-weight="bold">label</text><text x="845" y="130" fill="#166534" font-weight="bold">label</text>
