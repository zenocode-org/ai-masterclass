<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#475569"/></marker></defs>
<rect width="900" height="290" fill="#ffffff"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">QLoRA : base 4 bits gelée + adapters LoRA en 16/32 bits</text>
<g font-size="13" text-anchor="middle">
<rect x="30" y="60" width="250" height="90" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><text x="155" y="90" font-weight="bold">Poids W₀ stockés en NF4</text><text x="155" y="112">4 bits / poids + 1 constante / 64 poids</text><text x="155" y="132">≈ 4 Go pour Mistral 7B (au lieu de 14,5)</text>
<rect x="330" y="60" width="240" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="450" y="90" font-weight="bold">Déquantification à la volée</text><text x="450" y="112">NF4 → BF16 (ou FP16 sur T4)</text><text x="450" y="132">couche par couche, pendant le calcul</text>
<rect x="620" y="60" width="250" height="90" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/><text x="745" y="90" font-weight="bold">Calcul W₀x + (α/r)·BAx</text><text x="745" y="112">B, A : seuls paramètres entraînés</text><text x="745" y="132">gradients + AdamW sur ~42 M params</text>
<rect x="60" y="190" width="780" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="450" y="218" font-weight="bold">backward : le gradient TRAVERSE W₀ (gelé) pour atteindre les A et B des couches précédentes</text><text x="450" y="240">W₀ ne reçoit jamais de mise à jour → pas de gradient ni d'état AdamW à stocker pour 7 milliards de poids</text>
</g>
<g stroke="#475569" stroke-width="2" marker-end="url(#a)" fill="none">
<line x1="280" y1="105" x2="328" y2="105"/><line x1="570" y1="105" x2="618" y2="105"/>
<line x1="745" y1="150" x2="745" y2="188"/>
</g>
</svg>
