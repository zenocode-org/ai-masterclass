<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#475569"/></marker></defs>
<rect width="900" height="290" fill="#ffffff"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">QLoRA: frozen 4-bit base + 16/32-bit LoRA adapters</text>
<g font-size="13" text-anchor="middle">
<rect x="30" y="60" width="250" height="90" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><text x="155" y="90" font-weight="bold">Weights W₀ stored in NF4</text><text x="155" y="112">4 bits / weight + 1 constant / 64 weights</text><text x="155" y="132">≈ 4 GB for Mistral 7B (instead of 14.5)</text>
<rect x="330" y="60" width="240" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="450" y="90" font-weight="bold">On-the-fly dequantization</text><text x="450" y="112">NF4 → BF16 (or FP16 on T4)</text><text x="450" y="132">layer by layer, during computation</text>
<rect x="620" y="60" width="250" height="90" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/><text x="745" y="90" font-weight="bold">Compute W₀x + (α/r)·BAx</text><text x="745" y="112">B, A: the only trained parameters</text><text x="745" y="132">gradients + AdamW on ~42 M params</text>
<rect x="60" y="190" width="780" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="450" y="218" font-weight="bold">backward: the gradient FLOWS THROUGH W₀ (frozen) to reach the A and B of the earlier layers</text><text x="450" y="240">W₀ is never updated → no gradient or AdamW state to store for 7 billion weights</text>
</g>
<g stroke="#475569" stroke-width="2" marker-end="url(#a)" fill="none">
<line x1="280" y1="105" x2="328" y2="105"/><line x1="570" y1="105" x2="618" y2="105"/>
<line x1="745" y1="150" x2="745" y2="188"/>
</g>
</svg>
