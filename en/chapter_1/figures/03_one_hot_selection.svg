<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#475569"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#dc2626"/></marker></defs>
<rect width="900" height="300" fill="#ffffff"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Multiplying a one-hot by W = reading a row of W</text>
<g font-size="20" font-family="JetBrains Mono, monospace" text-anchor="middle">
<text x="130" y="80" font-family="Helvetica" font-size="13" fill="#475569">one-hot of “b”  (1, 3)</text>
<rect x="55" y="130" width="50" height="44" fill="#f8fafc" stroke="#94a3b8"/><rect x="105" y="130" width="50" height="44" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><rect x="155" y="130" width="50" height="44" fill="#f8fafc" stroke="#94a3b8"/>
<text x="80" y="160">0</text><text x="130" y="160" fill="#b45309" font-weight="bold">1</text><text x="180" y="160">0</text>
<g font-size="12" font-family="Helvetica" fill="#475569"><text x="80" y="192">a</text><text x="130" y="192">b</text><text x="180" y="192">c</text></g>
<text x="245" y="162" font-size="28">@</text>
<text x="400" y="62" font-family="Helvetica" font-size="13" fill="#475569">W  (3, 3): one row per current character</text>
<g fill="#f8fafc" stroke="#94a3b8">
<rect x="310" y="76" width="60" height="44"/><rect x="370" y="76" width="60" height="44"/><rect x="430" y="76" width="60" height="44"/>
<rect x="310" y="176" width="60" height="44"/><rect x="370" y="176" width="60" height="44"/><rect x="430" y="176" width="60" height="44"/>
</g>
<g fill="#fef3c7" stroke="#d97706" stroke-width="2"><rect x="310" y="126" width="60" height="44"/><rect x="370" y="126" width="60" height="44"/><rect x="430" y="126" width="60" height="44"/></g>
<text x="340" y="106">2</text><text x="400" y="106">1</text><text x="460" y="106">0</text>
<text x="340" y="156" fill="#b45309" font-weight="bold">4</text><text x="400" y="156" fill="#b45309" font-weight="bold">5</text><text x="460" y="156" fill="#b45309" font-weight="bold">6</text>
<text x="340" y="206">7</text><text x="400" y="206">8</text><text x="460" y="206">9</text>
<g font-size="12" font-family="Helvetica" fill="#475569" text-anchor="end"><text x="302" y="103">row a</text><text x="302" y="153">row b</text><text x="302" y="203">row c</text></g>
<text x="535" y="162" font-size="28">=</text>
<text x="680" y="80" font-family="Helvetica" font-size="13" fill="#475569">27 scores in reality, 3 here  (1, 3)</text>
<g fill="#fef3c7" stroke="#d97706" stroke-width="2"><rect x="590" y="130" width="60" height="44"/><rect x="650" y="130" width="60" height="44"/><rect x="710" y="130" width="60" height="44"/></g>
<text x="620" y="160">4</text><text x="680" y="160">5</text><text x="740" y="160">6</text>
<g font-size="12" font-family="Helvetica" fill="#475569"><text x="620" y="192">score a</text><text x="680" y="192">score b</text><text x="740" y="192">score c</text></g>
</g>
<text x="450" y="250" text-anchor="middle" font-size="14" fill="#0f172a">0 × (row a) + <tspan fill="#b45309" font-weight="bold">1 × (row b)</tspan> + 0 × (row c) = row b</text>
<text x="450" y="278" text-anchor="middle" font-size="13" fill="#475569">The zeros cancel the other rows: no mixing. This is exactly W[index] (and nn.Embedding in chapter 2).</text>
</svg>
