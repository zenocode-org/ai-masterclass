<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#475569"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#dc2626"/></marker></defs>
<rect width="900" height="300" fill="#ffffff"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">One iteration of the training loop: 5 steps, always in this order</text>
<g font-size="13" text-anchor="middle">
<rect x="20" y="80" width="150" height="90" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="95" y="105" font-weight="bold">1. Forward</text><text x="95" y="128" font-family="JetBrains Mono, monospace" font-size="12">probs = softmax(</text><text x="95" y="146" font-family="JetBrains Mono, monospace" font-size="12">xenc @ W)</text>
<rect x="195" y="80" width="150" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="270" y="105" font-weight="bold">2. Loss</text><text x="270" y="128" font-family="JetBrains Mono, monospace" font-size="12">-probs[arange(M),</text><text x="270" y="146" font-family="JetBrains Mono, monospace" font-size="12">ys].log().mean()</text>
<rect x="370" y="80" width="150" height="90" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="445" y="105" font-weight="bold">3. Reset</text><text x="445" y="132" font-family="JetBrains Mono, monospace" font-size="12">W.grad = None</text><text x="445" y="155" font-size="11" fill="#475569">otherwise they add up</text>
<rect x="545" y="80" width="150" height="90" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="620" y="105" font-weight="bold">4. Backward</text><text x="620" y="132" font-family="JetBrains Mono, monospace" font-size="12">loss.backward()</text><text x="620" y="155" font-size="11" fill="#475569">fills W.grad</text>
<rect x="720" y="80" width="160" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="800" y="105" font-weight="bold">5. Update</text><text x="800" y="132" font-family="JetBrains Mono, monospace" font-size="12">W -= lr * W.grad</text><text x="800" y="155" font-size="11" fill="#475569">under torch.no_grad()</text>
</g>
<g stroke="#475569" stroke-width="2" marker-end="url(#a)" fill="none"><line x1="170" y1="125" x2="193" y2="125"/><line x1="345" y1="125" x2="368" y2="125"/><line x1="520" y1="125" x2="543" y2="125"/><line x1="695" y1="125" x2="718" y2="125"/>
<path d="M800,170 v50 h-705 v-48"/></g>
<text x="450" y="242" text-anchor="middle" font-size="13" fill="#475569">start again with the new W (100 times here)</text>
<text x="450" y="280" text-anchor="middle" font-size="13" fill="#475569">In chapter 2: 1 → model(x, y) · 2 → F.cross_entropy · 3 → optimizer.zero_grad() · 5 → optimizer.step()</text>
</svg>
