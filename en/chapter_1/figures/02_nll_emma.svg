<text x="800" y="158" text-anchor="middle" font-size="14" font-weight="bold">mean</text>
<text x="800" y="186" text-anchor="middle" font-size="22" font-family="JetBrains Mono, monospace" fill="#b45309">2.51</text>
<text x="800" y="208" text-anchor="middle" font-size="12">= NLL of “emma”</text>
<text x="450" y="306" text-anchor="middle" font-size="13" fill="#475569">Small probability given to the correct answer → large penalty. Uniform model: −log(1/27) ≈ 3.30 everywhere.</text>
