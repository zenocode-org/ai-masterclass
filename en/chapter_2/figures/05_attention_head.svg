<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#475569"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#dc2626"/></marker></defs>
<rect width="900" height="360" fill="#fff"/>
<text x="450" y="26" text-anchor="middle" font-size="18" font-weight="bold">A causal attention head: out = softmax(mask(Q·Kᵀ / √d)) · V</text>
<g font-size="13" text-anchor="middle">
<rect x="20" y="150" width="110" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="75" y="174" font-weight="bold">x</text><text x="75" y="192" font-size="11">(B, T, C)</text>
<rect x="180" y="60" width="120" height="44" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="240" y="80" font-weight="bold">query</text><text x="240" y="96" font-size="11">Linear(C, d)</text>
<rect x="180" y="156" width="120" height="44" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="240" y="176" font-weight="bold">key</text><text x="240" y="192" font-size="11">Linear(C, d)</text>
<rect x="180" y="262" width="120" height="44" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="240" y="282" font-weight="bold">value</text><text x="240" y="298" font-size="11">Linear(C, d)</text>
<text x="330" y="78" font-size="12">Q (B,T,d)</text><text x="330" y="200" font-size="12">K (B,T,d)</text><text x="330" y="280" font-size="12">V (B,T,d)</text>
<rect x="380" y="100" width="120" height="50" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="440" y="121" font-weight="bold">Q · Kᵀ / √d</text><text x="440" y="139" font-size="11">scores (B, T, T)</text>
<rect x="530" y="100" width="110" height="50" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="585" y="121" font-weight="bold">mask</text><text x="585" y="139" font-size="11">future ← −∞</text>
<rect x="670" y="100" width="100" height="50" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="720" y="121" font-weight="bold">softmax</text><text x="720" y="139" font-size="11">per row</text>
<rect x="660" y="250" width="120" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="720" y="272" font-weight="bold">weights · V</text><text x="720" y="290" font-size="11">(B,T,T)@(B,T,d)</text>
<rect x="800" y="250" width="85" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="842" y="274" font-weight="bold">out</text><text x="842" y="292" font-size="11">(B, T, d)</text>
</g>
<g stroke="#475569" stroke-width="2" marker-end="url(#a)" fill="none">
<line x1="130" y1="170" x2="178" y2="84"/><line x1="130" y1="178" x2="178" y2="178"/><line x1="130" y1="186" x2="178" y2="282"/>
<path d="M300 82 L378 115"/><path d="M300 178 L378 135"/><line x1="500" y1="125" x2="528" y2="125"/><line x1="640" y1="125" x2="668" y2="125"/>
<line x1="720" y1="150" x2="720" y2="248"/><line x1="300" y1="284" x2="658" y2="284"/><line x1="780" y1="278" x2="798" y2="278"/>
</g>
<g font-size="12" fill="#475569">
<text x="320" y="225">Q·Kᵀ: “who should listen to whom?”  → relations between POSITIONS</text>
<text x="320" y="243">weights·V: “what to retrieve?”  → mixing of FEATURES</text>
<text x="20" y="340">In orange: the only learned parameters. The mask and the softmax have no parameters.</text>
</g>
</svg>
