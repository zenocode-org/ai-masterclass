<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#475569"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#dc2626"/></marker></defs>
<rect width="900" height="360" fill="#fff"/>
<text x="450" y="26" text-anchor="middle" font-size="18" font-weight="bold">The training loop (the same from the bigram to the GPT)</text>
<g font-size="13" text-anchor="middle">
<rect x="60" y="70" width="170" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="145" y="94" font-weight="bold">1. get_batch('train')</text><text x="145" y="112" font-size="11">xb, yb: (B, T)</text>
<rect x="340" y="70" width="190" height="56" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="435" y="94" font-weight="bold">2. forward</text><text x="435" y="112" font-size="11">logits, loss = model(xb, yb)</text>
<rect x="640" y="70" width="210" height="56" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="745" y="94" font-weight="bold">3. zero_grad</text><text x="745" y="112" font-size="11">clear the old gradients</text>
<rect x="640" y="210" width="210" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="745" y="234" font-weight="bold">4. loss.backward()</text><text x="745" y="252" font-size="11">gradient of EVERY parameter</text>
<rect x="340" y="210" width="190" height="56" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="435" y="234" font-weight="bold">5. optimizer.step()</text><text x="435" y="252" font-size="11">AdamW updates the weights</text>
<rect x="40" y="210" width="210" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="145" y="230" font-weight="bold">every eval_interval:</text><text x="145" y="248" font-size="11">estimate_loss() on train AND val</text><text x="145" y="262" font-size="11">model.eval() · no_grad · model.train()</text>
</g>
<g stroke="#475569" stroke-width="2" marker-end="url(#a)" fill="none">
<line x1="230" y1="98" x2="338" y2="98"/><line x1="530" y1="98" x2="638" y2="98"/><line x1="745" y1="126" x2="745" y2="208"/><line x1="640" y1="238" x2="532" y2="238"/>
<path d="M340 238 L290 238 L290 160 L145 160 L145 128"/>
</g>
<path d="M145 210 L145 175" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
<text x="450" y="310" text-anchor="middle" font-size="13" fill="#334155">Repeat max_iters times. Only the VALIDATION loss tells you whether the model generalizes.</text>
<text x="450" y="332" text-anchor="middle" font-size="12" fill="#475569">train ↓ and val ↓: it is learning · train ↓ and val ↑: it is reciting (overfitting)</text>
</svg>
