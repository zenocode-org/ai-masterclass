<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#475569"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#dc2626"/></marker></defs>
<rect width="900" height="500" fill="#fff"/>
<text x="300" y="28" text-anchor="middle" font-size="17" font-weight="bold">Original Transformer (2017): encoder + decoder</text>
<text x="765" y="28" text-anchor="middle" font-size="17" font-weight="bold">GPT: decoder only</text>
<line x1="625" y1="40" x2="625" y2="480" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5"/>
<g font-size="13" text-anchor="middle">
<!-- encoder -->
<rect x="40" y="130" width="220" height="230" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="150" y="152" font-weight="bold" fill="#334155">ENCODER × N</text>
<rect x="60" y="290" width="180" height="48" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="150" y="310" font-weight="bold">Self-attention</text><text x="150" y="327" font-size="11">bidirectional (no mask)</text>
<rect x="60" y="210" width="180" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="150" y="235" font-weight="bold">FeedForward</text>
<text x="150" y="172" font-size="11" fill="#475569">+ residuals, LayerNorm</text>
<rect x="60" y="400" width="180" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="150" y="418" font-weight="bold">source sentence</text><text x="150" y="433" font-size="11">“Je suis étudiant”</text>
<!-- decoder -->
<rect x="340" y="80" width="240" height="280" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="350" y="102" text-anchor="start" font-weight="bold" fill="#5b21b6">DECODER × N</text>
<rect x="360" y="290" width="200" height="48" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="460" y="310" font-weight="bold">Masked self-attention</text><text x="460" y="327" font-size="11">causal: only the past</text>
<rect x="360" y="210" width="200" height="48" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="460" y="230" font-weight="bold">Cross-attention</text><text x="460" y="247" font-size="11">Q: decoder · K, V: encoder</text>
<rect x="360" y="130" width="200" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="460" y="155" font-weight="bold">FeedForward</text>
<rect x="360" y="400" width="200" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="460" y="418" font-weight="bold">translation produced so far</text><text x="460" y="433" font-size="11">“I am a”</text>
<rect x="335" y="40" width="250" height="30" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="460" y="60">Linear + softmax → “student”</text>
<!-- gpt -->
<rect x="665" y="130" width="200" height="230" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="672" y="150" text-anchor="start" font-weight="bold" fill="#5b21b6">× n_layer</text>
<rect x="680" y="290" width="170" height="48" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="765" y="310" font-weight="bold">Masked self-attention</text><text x="765" y="327" font-size="11">multi-head</text>
<rect x="680" y="210" width="170" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="765" y="235" font-weight="bold">FeedForward</text>
<text x="672" y="275" text-anchor="start" font-size="11" fill="#475569">+ residuals, LN</text>
<rect x="680" y="400" width="170" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="765" y="418" font-weight="bold">text written so far</text><text x="765" y="433" font-size="11">“First Citize”</text>
<rect x="675" y="80" width="180" height="30" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="765" y="100">Linear → “n”</text>
</g>
<g stroke="#475569" stroke-width="2" marker-end="url(#a)" fill="none">
<line x1="150" y1="400" x2="150" y2="340"/><line x1="150" y1="290" x2="150" y2="252"/>
<line x1="460" y1="400" x2="460" y2="340"/><line x1="460" y1="290" x2="460" y2="260"/><line x1="460" y1="210" x2="460" y2="172"/><line x1="460" y1="130" x2="460" y2="72"/>
<line x1="765" y1="400" x2="765" y2="340"/><line x1="765" y1="290" x2="765" y2="252"/><line x1="765" y1="210" x2="765" y2="112"/>
</g>
<path d="M150 210 L150 185 L300 185 L300 234 L358 234" stroke="#dc2626" stroke-width="2.5" fill="none" marker-end="url(#r)"/>
<text x="300" y="178" text-anchor="middle" font-size="11" fill="#dc2626">K, V</text>
<g font-size="12" fill="#334155">
<text x="40" y="470">Use: translation, summarization (sequence → sequence).</text>
<text x="660" y="465">Use: continue a text.</text>
<text x="660" y="482">No encoder, no cross-attention.</text>
</g>
</svg>
